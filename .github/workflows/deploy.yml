# Сборка Next.js (статический экспорт) и публикация на GitHub Pages.
# После первого пуши: Settings → Pages → Source: GitHub Actions (настраивается один раз),
# workflow сам развернёт сайт по адресу https://<user>.github.io/oktashop/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Базовый путь сайта = имя репозитория (GitHub Pages project site).
      NEXT_PUBLIC_BASE_PATH: /oktashop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Кэш .next/cache: next/font хранит скачанные Google-шрифты. Без кэша
      # каждый билд ходит в сеть, и при сбое Google CI падал с
      # «TypeError: Cannot read properties of null» в next/font.
      - name: Cache Next.js build (fonts, webpack)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Три попытки: даже с кэшем первый запуск может споткнуться о сеть —
      # деплой не должен висеть из-за одного сбитого запроса.
      - name: Build (static export)
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "Build attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
